# React SPA + Django-র সামনে দাঁড়ানো রিভার্স প্রক্সি।
#
# ব্রাউজার সবকিছু একটাই ঠিকানায় (http://localhost:8080) পায় —
# পেজ, API, ছবি। এক অরিজিন মানে CORS-এর ঝামেলা নেই।

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NID/পণ্যের ছবি আপলোডের জন্য — ডিফল্ট ১ MB-তে মোবাইলের ছবি আটকে যেত
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------- আপলোড করা ছবি
    # Django DEBUG=False-এ media ফাইল দেয় না। ফাইলগুলো shared ভলিউমে,
    # তাই nginx সরাসরি দেয় — এটা Django-র চেয়ে অনেক দ্রুত।
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # ------------------------------------------------------------- API
    # /django-admin/ এর নামটা DJANGO_ADMIN_URL দিয়ে বদলালে এখানেও
    # বদলাতে হবে, নইলে nginx ওই পথ চিনবে না।
    location ~ ^/(api|static|django-admin)/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------ বিল্ড অ্যাসেট
    # ফাইলের নামে হ্যাশ থাকে, তাই বদলালে নামও বদলায় — চিরকাল ক্যাশ নিরাপদ
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html কখনো ক্যাশ হবে না।
    #
    # এই ফাইলটাই বলে দেয় কোন হ্যাশওয়ালা চাংক লোড হবে। নতুন বিল্ড দেওয়ার
    # পর ব্রাউজারে পুরোনো index.html থেকে গেলে সে পুরোনো নামের চাংক
    # খুঁজবে — যেটা আর নেই। তখন পাতা বদলাতে গেলেই
    # "Failed to fetch dynamically imported module" এসে সাইট আটকে যায়।
    location = /index.html {
        # `expires -1` দিলে nginx নিজেও একটা Cache-Control বসায় —
        # তখন দুইটা হেডার যেত। একটাই যথেষ্ট।
        add_header Cache-Control "no-store, must-revalidate";
    }

    # -------------------------------------------------------- SPA রাউটিং
    # /products/phone সরাসরি খুললে ওই নামে ফাইল নেই — index.html দিতে হয়,
    # নইলে React Router পাতাটা দেখানোর সুযোগই পেত না (৪০৪ আসত)।
    location / {
        try_files $uri $uri/ /index.html;
    }
}
